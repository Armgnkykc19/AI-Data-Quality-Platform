dataset:
  name: fixture
  version: "0.1.0"

evaluation:
  entity_resolution:
    enabled: true
  survivorship:
    enabled: true
  schema_mapping:
    enabled: true
  normalization:
    enabled: true
  validation:
    enabled: true

# Infrastructure fixture/smoke gates — NOT product quality.
infrastructure_gates:
  auto_merge_precision:
    operator: gte
    threshold: 0.99

  false_merge_rate:
    operator: lte
    threshold: 0.005

  candidate_recall:
    operator: gte
    threshold: 0.94

  schema_mapping_accuracy:
    operator: gte
    threshold: 0.98

  normalization_accuracy:
    operator: gte
    threshold: 0.995

  review_routing_recall:
    operator: gte
    threshold: 0.95

# Backward-compatible alias consumed by legacy tests.
hard_gates:
  auto_merge_precision:
    operator: gte
    threshold: 0.99
  false_merge_rate:
    operator: lte
    threshold: 0.005
  candidate_recall:
    operator: gte
    threshold: 0.94
  schema_mapping_accuracy:
    operator: gte
    threshold: 0.98
  normalization_accuracy:
    operator: gte
    threshold: 0.995
  review_routing_recall:
    operator: gte
    threshold: 0.95

product_gates:
  enabled: true
  require_dataset: true
  gates:
    entity_resolution_auto_match_precision:
      metric: entity_resolution_auto_match_precision
      operator: gte
      threshold: 0.99
    entity_resolution_false_match_rate:
      metric: entity_resolution_false_match_rate
      operator: lte
      threshold: 0.0
    entity_resolution_candidate_recall:
      metric: entity_resolution_candidate_recall
      operator: gte
      threshold: 0.94
    schema_mapping_accuracy:
      metric: schema_mapping_accuracy
      operator: gte
      threshold: 0.95
    critical_field_mapping_recall:
      metric: critical_field_mapping_recall
      operator: gte
      threshold: 0.95
    source_b_mapping_accuracy:
      metric: source_b_mapping_accuracy
      operator: gte
      threshold: 0.95
    normalization_accuracy:
      metric: normalization_accuracy
      operator: gte
      threshold: 0.995
    silent_row_loss_rate:
      metric: silent_row_loss_rate
      operator: lte
      threshold: 0.0
    survivorship_field_match_rate:
      metric: survivorship_field_match_rate
      operator: gte
      threshold: 0.94
    survivorship_conflict_preservation_rate:
      metric: survivorship_conflict_preservation_rate
      operator: gte
      threshold: 1.0

reporting:
  output_directory: evaluation/reports/latest
  json: true
  markdown: true
