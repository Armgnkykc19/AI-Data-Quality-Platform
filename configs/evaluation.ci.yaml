dataset:
  name: fixture
  version: "0.1.0"

# Infrastructure smoke only. This file is not product acceptance.
# Product quality remains configs/evaluation.yaml (candidate-recall >= 0.94).
# CI still enforces the same certified 7B/08 quality and review-safety bars on
# the small ci-smoke dataset; it must not print Overall Acceptance as product PASS.
acceptance_mode: infrastructure_smoke
product_acceptance: false

evaluation:
  entity_resolution:
    enabled: true
  survivorship:
    enabled: true
  schema_mapping:
    enabled: true
  normalization:
    enabled: true
  validation:
    enabled: true

infrastructure_gates:
  auto_merge_precision:
    operator: gte
    threshold: 0.99
  false_merge_rate:
    operator: lte
    threshold: 0.005
  candidate_recall:
    operator: gte
    threshold: 0.94
  schema_mapping_accuracy:
    operator: gte
    threshold: 0.98
  normalization_accuracy:
    operator: gte
    threshold: 0.995
  review_routing_recall:
    operator: gte
    threshold: 0.95

hard_gates:
  auto_merge_precision:
    operator: gte
    threshold: 0.99
  false_merge_rate:
    operator: lte
    threshold: 0.005
  candidate_recall:
    operator: gte
    threshold: 0.94
  schema_mapping_accuracy:
    operator: gte
    threshold: 0.98
  normalization_accuracy:
    operator: gte
    threshold: 0.995
  review_routing_recall:
    operator: gte
    threshold: 0.95

product_gates:
  enabled: true
  require_dataset: true
  gates:
    entity_resolution_auto_match_precision:
      metric: entity_resolution_auto_match_precision
      operator: gte
      threshold: 0.99
    entity_resolution_false_match_rate:
      metric: entity_resolution_false_match_rate
      operator: lte
      threshold: 0.0
    entity_resolution_candidate_recall:
      metric: entity_resolution_candidate_recall
      operator: gte
      threshold: 0.94
    schema_mapping_accuracy:
      metric: schema_mapping_accuracy
      operator: gte
      threshold: 0.95
    critical_field_mapping_recall:
      metric: critical_field_mapping_recall
      operator: gte
      threshold: 0.95
    source_b_mapping_accuracy:
      metric: source_b_mapping_accuracy
      operator: gte
      threshold: 0.95
    normalization_accuracy:
      metric: normalization_accuracy
      operator: gte
      threshold: 0.995
    silent_row_loss_rate:
      metric: silent_row_loss_rate
      operator: lte
      threshold: 0.0
    survivorship_field_match_rate:
      metric: survivorship_field_match_rate
      operator: gte
      threshold: 0.94
    survivorship_conflict_preservation_rate:
      metric: survivorship_conflict_preservation_rate
      operator: gte
      threshold: 1.0
    review_unresolved_unsafe_merge_violations:
      metric: review_unresolved_unsafe_merge_violations
      operator: lte
      threshold: 0.0
    review_no_match_transitive_merge_violations:
      metric: review_no_match_transitive_merge_violations
      operator: lte
      threshold: 0.0
    review_unauthorized_severe_conflict_merges:
      metric: review_unauthorized_severe_conflict_merges
      operator: lte
      threshold: 0.0
    review_human_match_without_provenance_violations:
      metric: review_human_match_without_provenance_violations
      operator: lte
      threshold: 0.0

reporting:
  output_directory: evaluation/reports/latest
  json: true
  markdown: true
