name: Evaluation CI

on:
  push:
    branches:
      - main
      - "sprint-*"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff
        run: ruff check .

      - name: Run Ruff Format Check
        run: ruff format --check .

      - name: Run tests
        run: pytest

      - name: Build golden dataset CI smoke artifact
        run: python scripts/build_golden_dataset.py --config configs/dataset.ci.yaml

      - name: Validate golden dataset CI smoke artifact
        run: python scripts/validate_dataset.py --dataset datasets/generated/ci-smoke/v0.1.0

      - name: Profile CSV parser smoke
        run: python scripts/profile_dataset.py datasets/golden/v0.1.0/malformed/utf8_turkish.csv

      - name: Build XLSX parser smoke fixture and profile
        run: |
          python - <<'PY'
          from pathlib import Path
          from openpyxl import Workbook
          path = Path("datasets/generated/ci-smoke/smoke.xlsx")
          path.parent.mkdir(parents=True, exist_ok=True)
          wb = Workbook()
          ws = wb.active
          ws.title = "Customers"
          ws.append(["name", "email"])
          ws.append(["Ali", "ali@example.test"])
          wb.save(path)
          PY
          python scripts/profile_dataset.py datasets/generated/ci-smoke/smoke.xlsx

      - name: Run evaluation smoke test
        run: python -m evaluation.run --dataset datasets/generated/ci-smoke/v0.1.0 --malformed-fixtures datasets/golden/v0.1.0/malformed

      - name: Build validation CLI smoke fixtures
        run: |
          python - <<'PY'
          from pathlib import Path

          output_dir = Path("datasets/generated/ci-smoke")
          output_dir.mkdir(parents=True, exist_ok=True)

          positive = output_dir / "validation-positive-smoke.csv"
          positive.write_text(
              "first_name,last_name,email,phone,company,city,district,address\n"
              "Ayşe,Yılmaz,ayse@example.com,+905321234567,Acme A.Ş.,İstanbul,Kadıköy,Bağdat Caddesi No:1\n",
              encoding="utf-8",
          )

          negative = output_dir / "validation-negative-smoke.csv"
          negative.write_text(
              "first_name,last_name,email,phone,company,city,district,address\n"
              "Ali,Kaya,broken@@example.com,+905321234567,Acme A.Ş.,İstanbul,Kadıköy,Test Sokak\n",
              encoding="utf-8",
          )
          PY

      - name: Validation CLI positive smoke
        run: |
          python scripts/validate_records.py datasets/generated/ci-smoke/validation-positive-smoke.csv --report-dir validation/reports/ci-positive-smoke
          exit_code=$?
          if [ "$exit_code" -ne 0 ]; then
            echo "Expected validation exit code 0 for valid fixture, got $exit_code"
            exit 1
          fi
          echo "Validation correctly accepted valid fixture."

      - name: Validation CLI negative smoke
        run: |
          set +e
          python scripts/validate_records.py datasets/generated/ci-smoke/validation-negative-smoke.csv --report-dir validation/reports/ci-negative-smoke
          exit_code=$?
          set -e
          if [ "$exit_code" -ne 1 ]; then
            echo "Expected validation exit code 1 for invalid fixture, got $exit_code"
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("validation/reports/ci-negative-smoke/validation_report.json")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          summary = report["summary"]
          assert summary["invalid_records"] == 1, summary
          assert summary["error_count"] >= 1, summary
          print("Validation negative smoke report confirmed invalid record.")
          PY
          echo "Validation correctly rejected invalid fixture."

      - name: Normalization CLI positive smoke
        run: |
          python scripts/normalize_records.py datasets/generated/ci-smoke/validation-positive-smoke.csv --report-dir normalization/reports/ci-positive-smoke
          exit_code=$?
          if [ "$exit_code" -ne 0 ]; then
            echo "Expected normalization exit code 0 for valid fixture, got $exit_code"
            exit 1
          fi
          echo "Normalization CLI completed successfully for valid fixture."

      - name: Build schema mapping smoke fixtures
        run: |
          python - <<'PY'
          from pathlib import Path

          output_dir = Path("datasets/generated/ci-smoke")
          output_dir.mkdir(parents=True, exist_ok=True)

          positive = output_dir / "mapping-positive-smoke.csv"
          positive.write_text(
              "ad,soyad,e_mail,gsm,sirket,sehir,ilce,adres\n"
              "Ayse,Yilmaz,ayse@example.com,05321234567,Acme AS,Istanbul,Kadikoy,Test Sokak\n",
              encoding="utf-8",
          )

          ambiguous = output_dir / "mapping-ambiguous-smoke.csv"
          ambiguous.write_text(
              "contact,first_name,last_name\n"
              "ali@example.com,Ali,Kaya\n",
              encoding="utf-8",
          )
          PY

      - name: Schema mapping CLI positive smoke
        run: |
          python scripts/map_schema.py datasets/generated/ci-smoke/mapping-positive-smoke.csv --report-dir schema_mapping/reports/ci-positive-smoke
          exit_code=$?
          if [ "$exit_code" -ne 0 ]; then
            echo "Expected schema mapping exit code 0, got $exit_code"
            exit 1
          fi
          echo "Schema mapping positive smoke completed."

      - name: Schema mapping CLI ambiguous smoke
        run: |
          python scripts/map_schema.py datasets/generated/ci-smoke/mapping-ambiguous-smoke.csv --report-dir schema_mapping/reports/ci-ambiguous-smoke
          exit_code=$?
          if [ "$exit_code" -ne 0 ]; then
            echo "Expected schema mapping exit code 0 for plan generation, got $exit_code"
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("schema_mapping/reports/ci-ambiguous-smoke/mapping_report.json").read_text(
                  encoding="utf-8"
              )
          )
          contact = next(
              item for item in report["column_mappings"] if item["source_column"] == "contact"
          )
          assert contact["decision"] == "REVIEW", contact
          print("Schema mapping ambiguous smoke confirmed REVIEW routing.")
          PY

      - name: Entity resolution CLI smoke
        run: |
          python scripts/resolve_entities.py datasets/generated/ci-smoke/validation-positive-smoke.csv --report-dir entity_resolution/reports/ci-positive-smoke
          exit_code=$?
          if [ "$exit_code" -ne 0 ]; then
            echo "Expected entity resolution exit code 0, got $exit_code"
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("entity_resolution/reports/ci-positive-smoke/entity_resolution_report.json").read_text(
                  encoding="utf-8"
              )
          )
          assert "summary" in report
          print("Entity resolution smoke report confirmed.")
          PY
          echo "Entity resolution CLI smoke completed."

      - name: Survivorship CLI smoke
        run: |
          python scripts/build_canonical_entities.py datasets/generated/ci-smoke/validation-positive-smoke.csv --report-dir survivorship/reports/ci-positive-smoke
          exit_code=$?
          if [ "$exit_code" -ne 0 ]; then
            echo "Expected survivorship exit code 0, got $exit_code"
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("survivorship/reports/ci-positive-smoke/survivorship_report.json").read_text(
                  encoding="utf-8"
              )
          )
          assert "summary" in report
          assert report["summary"]["canonical_entity_count"] >= 1
          print("Survivorship smoke report confirmed.")
          PY
          echo "Survivorship CLI smoke completed."
